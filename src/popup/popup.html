<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TunnelTube</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="tt-header">
      <img class="tt-logo" src="../../icons/icon32.png" alt="" width="24" height="24" />
      <h1 class="tt-title">TunnelTube</h1>
    </header>

    <label class="tt-toggle" for="tt-enabled">
      <input id="tt-enabled" type="checkbox" />
      <span>Tunnel vision</span>
      <span class="tt-state" id="tt-state">off</span>
    </label>

    <fieldset class="tt-modes" id="tt-modes">
      <legend>Lock mode</legend>
      <label>
        <input type="radio" name="tt-mode" value="topic" />
        <span>
          Topic
          <em>only videos matching your keywords</em>
        </span>
      </label>
      <label>
        <input type="radio" name="tt-mode" value="playlist" />
        <span>
          Playlist
          <em>one playlist, nothing else</em>
        </span>
      </label>
    </fieldset>

    <footer class="tt-footer">
      <button type="button" id="tt-options" class="tt-link">Settings</button>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
